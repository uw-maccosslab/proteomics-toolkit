name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to an exact version: ruff-action v4 uses immutable releases and
      # publishes no moving `v4` major tag, so `@v4` would not resolve. v4 is
      # also the first release to run on node24; v3 targets the deprecated
      # node20. Bump this tag deliberately when upgrading.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          # Read the ruff pin from the dev extras in pyproject.toml so the CI
          # lint gate and local `.venv/bin/ruff` always run the same version.
          version-file: "pyproject.toml"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
